<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Result Calculator</h1>

        <input type="text" id="studentName" placeholder="Enter Student Name">

        <input type="text" id="registerNo" placeholder="Enter Register Number">

        <h3>Enter Marks</h3>

        <input type="number" id="tamil" placeholder="Tamil Marks">
        <input type="number" id="english" placeholder="English Marks">
        <input type="number" id="python" placeholder="Python Marks">
        <input type="number" id="maths" placeholder="Maths Marks">
        <input type="number" id="computer" placeholder="Computer Marks">

        <button onclick="calculateResult()">Calculate Result</button>
        <button onclick="resetForm()">Reset</button>
        <button onclick="window.print()">Print Result</button>76

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
